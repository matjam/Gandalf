name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The vault lives on whichever machine the agent runs on, so the build
    # matrix is the platform guarantee: no cgo, no platform-specific paths.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # No -race: it requires cgo, and building without cgo is the property
      # this matrix exists to prove. Add a separate cgo-enabled race job when
      # the server introduces concurrency.
      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
